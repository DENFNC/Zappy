worker_processes  auto;
worker_rlimit_nofile 100000;

events {
    worker_connections  65535;
    use                 epoll;
}

http {
    include             mime.types;
    default_type        application/octet-stream;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  100;
    server_tokens       off;
    reset_timedout_connection  on;

    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    gzip                on;
    gzip_min_length     1024;
    gzip_buffers        4 16k;
    gzip_comp_level     5;
    gzip_types          text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_vary           on;

    limit_req_zone $binary_remote_addr zone=req_limit:20m rate=50r/s;
    limit_req_status 429;

    upstream auth_service {
        server auth_service:8083 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }
    upstream user_service {
        server user_service:8081 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }
    upstream catalog_service {
        server catalog_service:8082 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }
    upstream review_service {
        server review_service:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    proxy_connect_timeout   5s;
    proxy_send_timeout      30s;
    proxy_read_timeout      30s;
    proxy_buffer_size       32k;
    proxy_buffers           8 64k;
    proxy_busy_buffers_size 128k;
    proxy_temp_file_write_size 128k;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=shared_cache:200m inactive=30m max_size=500m;
    proxy_cache_key "$scheme$host$request_uri";
    proxy_cache_valid 200 302 10m;
    proxy_cache_valid 404      1m;
    proxy_cache_min_uses 3;

    server {
        listen       80;
        server_name  _;

        location /api/v1/ {
            limit_req zone=req_limit burst=100 nodelay;

            set $svc "";
            set $rest "";

            if ($uri ~ ^/api/v1/(?<svc>[a-zA-Z0-9_-]+)/(?.*)) {
                set $rest $2;
            }

            proxy_pass http://$svc_service/v1/$svc/$rest$is_args$args;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache shared_cache;
            proxy_cache_bypass $http_cache_control;
        }

        # location = /healthz {
            # return 200 'OK';
            # add_header Content-Type text/plain;
        # }
    }
}
